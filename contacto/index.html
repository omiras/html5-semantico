<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Prácticas HTML</title>
</head>
<body>
    <h1>Contacto</h1>
    <!-- Completa esta lista con enlaces a Inicio, Enlaces, Imágenes y Multimedia. -->
    <ul>
        <li>Inicio</li>
        <li>Enlaces</li>
        <li>Imágenes</li>
        <li>Multimedia</li>
        <li>Contacto</li>
    </ul>

    <!-- Formulario de práctica: todavía no está conectado a un servicio de envío. -->
    <form>
        <label for="asunto">Asunto:</label>
        <input type="text" id="asunto" name="asunto" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="comentarios">Comentarios:</label>
        <br>
        <textarea id="comentarios" name="comentarios" rows="4" cols="40" required></textarea>
        <br><br>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
